<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>Estúdio Neto Web Rádio | Ao Vivo</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.4);
            --bg: #090d16;
            --card-bg: rgba(17, 24, 39, 0.75);
            --border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.15) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .back-link {
            position: absolute;
            top: 24px;
            left: 24px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.2s ease;
        }
        .back-link:hover {
            color: var(--text-main);
        }

        .player-container {
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border);
            border-radius: 32px;
            padding: 35px 30px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .station-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 20px;
        }

        .station-name {
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .live-badge {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
            font-size: 0.7rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 100px;
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 1px;
        }

        .live-dot {
            width: 6px;
            height: 6px;
            background: #ef4444;
            border-radius: 50%;
            box-shadow: 0 0 8px #ef4444;
            animation: blink 1.4s infinite;
        }

        @keyframes blink {
            50% { opacity: 0.3; }
        }

        /* Moldura 16:9 */
        .artwork-wrapper {
            position: relative;
            width: 100%;
            height: 200px;
            border-radius: 20px;
            background: #0f172a;
            border: 1px solid var(--border);
            overflow: hidden;
            margin-bottom: 22px;
            box-shadow: 0 15px 30px -10px rgba(0, 0, 0, 0.6);
        }

        /* Imagem .jpg */
        .radio-logo-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease;
        }

        .player-container:hover .radio-logo-img {
            transform: scale(1.03);
        }

        .overlay-gradient {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(9, 13, 22, 0.9) 0%, rgba(9, 13, 22, 0.2) 50%, transparent 100%);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 12px;
        }

        .visualizer {
            display: flex;
            align-items: flex-end;
            gap: 4px;
            height: 20px;
        }

        .bar {
            width: 4px;
            height: 5px;
            background: #38bdf8;
            border-radius: 4px;
            transition: height 0.2s ease;
        }

        .playing .bar {
            animation: bounce 1s infinite alternate ease-in-out;
        }

        .playing .bar:nth-child(1) { animation-delay: 0.1s; }
        .playing .bar:nth-child(2) { animation-delay: 0.4s; }
        .playing .bar:nth-child(3) { animation-delay: 0.2s; }
        .playing .bar:nth-child(4) { animation-delay: 0.6s; }
        .playing .bar:nth-child(5) { animation-delay: 0.3s; }

        @keyframes bounce {
            0% { height: 4px; }
            100% { height: 20px; }
        }

        .track-details {
            text-align: center;
            width: 100%;
            margin-bottom: 20px;
        }

        .genre-tag {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--primary);
            background: rgba(99, 102, 241, 0.1);
            padding: 3px 12px;
            border-radius: 6px;
            display: inline-block;
            margin-bottom: 8px;
        }

        .track-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 4px;
            word-break: break-word;
        }

        .track-artist {
            font-size: 0.85rem;
            color: var(--text-muted);
            word-break: break-word;
        }

        .error-box {
            display: none;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.75rem;
            width: 100%;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .player-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 100%;
            margin-bottom: 25px;
        }

        .control-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .control-btn:hover {
            color: var(--text-main);
            transform: scale(1.1);
        }

        .btn-play {
            width: 65px;
            height: 65px;
            background: var(--primary);
            border-radius: 50%;
            color: #ffffff;
            box-shadow: 0 0 25px var(--primary-glow);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-play:hover {
            transform: scale(1.06);
            color: #ffffff;
            box-shadow: 0 0 35px var(--primary-glow);
        }

        .volume-box {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 80%;
        }

        .volume-box svg {
            fill: var(--text-muted);
            width: 18px;
            height: 18px;
        }

        input[type="range"] {
            flex: 1;
            height: 5px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 5px;
            appearance: none;
            -webkit-appearance: none;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: var(--text-main);
            border-radius: 50%;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
        Estúdio Neto Principal
    </a>

    <main class="player-container">
        <div class="station-header">
            <span class="station-name">Estúdio Neto</span>
            <div class="live-badge">
                <span class="live-dot"></span> NO AR
            </div>
        </div>

        <div class="artwork-wrapper">
            <!-- AGORA PROCURA POR logoradio.jpg -->
            <img src="imagens/radiologo.jpg" alt="Estúdio Neto Web Rádio" class="radio-logo-img" onerror="this.src='favicon.png'; this.onerror=null;">
            
            <div class="overlay-gradient">
                <div class="visualizer" id="visualizer">
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                </div>
            </div>
        </div>

        <div class="track-details">
            <span class="genre-tag" id="track-category">Web Rádio</span>
            <div class="track-title" id="track-title">Buscando músicas...</div>
            <div class="track-artist" id="track-artist">Aguarde um instante</div>
        </div>

        <div class="error-box" id="error-box"></div>

        <div class="player-controls">
            <button class="control-btn" id="prev-btn" title="Anterior">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
            </button>

            <button class="control-btn btn-play" id="play-btn" title="Reproduzir">
                <svg id="play-icon" width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            </button>

            <button class="control-btn" id="next-btn" title="Próxima">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
            </button>
        </div>

        <div class="volume-box">
            <svg viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5z"/></svg>
            <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.8">
            <svg viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
        </div>
    </main>

    <audio id="audio-player" preload="metadata"></audio>

    <script>
        const GITHUB_USER = "EstudioNeto";
        const GITHUB_REPO = "estudio-neto-mastering1";
        const AUDIO_FOLDER_API = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/audio`;

        let playlist = [];
        let currentIndex = 0;
        let isPlaying = false;

        const audio = document.getElementById("audio-player");
        const playBtn = document.getElementById("play-btn");
        const playIcon = document.getElementById("play-icon");
        const nextBtn = document.getElementById("next-btn");
        const prevBtn = document.getElementById("prev-btn");
        const titleEl = document.getElementById("track-title");
        const artistEl = document.getElementById("track-artist");
        const categoryEl = document.getElementById("track-category");
        const visualizer = document.getElementById("visualizer");
        const volumeSlider = document.getElementById("volume-slider");
        const errorBox = document.getElementById("error-box");

        const playSVG = '<polygon points="5 3 19 12 5 21 5 3"/>';
        const pauseSVG = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';

        async function carregarMusicasAutomaticamente() {
            try {
                const response = await fetch(`${AUDIO_FOLDER_API}?t=${Date.now()}`);
                if (!response.ok) throw new Error("Erro ao listar músicas.");
                
                const arquivos = await response.json();
                const mp3s = arquivos.filter(arq => arq.name.toLowerCase().endsWith('.mp3'));

                if (mp3s.length === 0) {
                    titleEl.textContent = "Nenhuma música encontrada";
                    artistEl.textContent = "Suba arquivos .mp3 na pasta audio";
                    return;
                }

                playlist = mp3s.map(arq => {
                    const nomeLimpo = arq.name.replace(/\.mp3$/i, '');
                    let artista = "Estúdio Neto";
                    let titulo = nomeLimpo;

                    if (nomeLimpo.includes(' - ')) {
                        const partes = nomeLimpo.split(' - ');
                        artista = partes[0].trim();
                        titulo = partes[1].trim();
                    }

                    return {
                        title: titulo,
                        artist: artista,
                        category: "Web Rádio",
                        src: `audio/${arq.name}`
                    };
                });

                loadTrack(0);

            } catch (err) {
                console.warn("Aviso na API, usando faixa direta de segurança:", err);
                playlist = [
                    {
                        title: "Brisa do Horizonte",
                        artist: "Estúdio Neto",
                        category: "Web Rádio",
                        src: "audio/Brisa do Horizonte.mp3"
                    }
                ];
                loadTrack(0);
            }
        }

        function loadTrack(index) {
            if (!playlist || playlist.length === 0) return;
            errorBox.style.display = "none";
            const track = playlist[index];

            audio.src = encodeURI(track.src);
            audio.load();

            titleEl.textContent = track.title;
            artistEl.textContent = track.artist;
            categoryEl.textContent = track.category;
        }

        audio.addEventListener("error", function() {
            if (!playlist[currentIndex]) return;
            errorBox.style.display = "block";
            errorBox.innerHTML = `⚠️ <b>Aguardando liberação do áudio:</b><br>O arquivo está sendo publicado pelo GitHub. Aguarde 1 minuto e atualize.`;
            visualizer.classList.remove("playing");
            playIcon.innerHTML = playSVG;
            isPlaying = false;
        });

        function play() {
            audio.play().then(() => {
                isPlaying = true;
                playIcon.innerHTML = pauseSVG;
                visualizer.classList.add("playing");
                errorBox.style.display = "none";
            }).catch(err => {
                console.warn("Aguardando interação:", err);
            });
        }

        function pause() {
            audio.pause();
            isPlaying = false;
            playIcon.innerHTML = playSVG;
            visualizer.classList.remove("playing");
        }

        function togglePlay() {
            isPlaying ? pause() : play();
        }

        function nextTrack() {
            if (playlist.length === 0) return;
            currentIndex = (currentIndex + 1) % playlist.length;
            loadTrack(currentIndex);
            if (isPlaying) play();
        }

        function prevTrack() {
            if (playlist.length === 0) return;
            currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
            loadTrack(currentIndex);
            if (isPlaying) play();
        }

        playBtn.addEventListener("click", togglePlay);
        nextBtn.addEventListener("click", nextTrack);
        prevBtn.addEventListener("click", prevTrack);

        audio.addEventListener("ended", () => {
            nextTrack();
            play();
        });

        volumeSlider.addEventListener("input", (e) => {
            audio.volume = e.target.value;
        });

        carregarMusicasAutomaticamente();
    </script>
</body>
</html>
