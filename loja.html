<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loja Virtual — Estúdio Neto</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <script src="https://cdn.tailwindcss.com"></script>

</head>
<body class="bg-gray-50 text-gray-800 min-h-screen font-sans flex flex-col justify-between">

  <header class="border-b border-gray-200 bg-gray-900 sticky top-0 z-50 px-6 py-4 text-gray-200">
    <div class="max-w-[1200px] mx-auto flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3 text-decoration-none">
        <span class="text-3xl">🎛️</span>
        <h1 class="text-xl font-bold text-white">Estúdio Neto</h1>
      </a>
      <nav class="hidden md:flex gap-6 text-sm font-semibold">
        <a href="index.html" class="hover:text-white transition-colors">Início</a>
        <a href="loja.html" class="text-white border-b-2 border-indigo-500 pb-1">Loja</a>
        <a href="contato.html" class="hover:text-white transition-colors">Contato</a>
      </nav>
    </div>
  </header>

  <main class="max-w-[1200px] w-full mx-auto px-4 py-8 flex-grow flex flex-col lg:flex-row gap-8">
    <aside class="w-full lg:w-[250px] flex-shrink-0">
      <div class="mb-6">
        <h1 class="text-[26px] font-semibold text-gray-900 leading-tight">Nossos Produtos</h1>
        <p class="text-sm text-gray-500 mt-1" id="total-produtos">Carregando...</p>
      </div>
      <div class="bg-white rounded-lg p-5 border border-gray-200 shadow-sm hidden lg:block">
        <h3 class="font-semibold text-gray-900 mb-3">Categorias</h3>
        <ul class="space-y-2 text-[14px] text-gray-600" id="lista-categorias">
          <li><span class="text-gray-400 italic">Buscando categorias...</span></li>
        </ul>
      </div>
    </aside>

    <section class="flex-grow">
      <div class="flex justify-between items-center bg-white p-3 rounded-lg border border-gray-200 shadow-sm mb-6">
        <div class="text-[14px] text-gray-600 flex items-center gap-2">
          <span>Ordenar por:</span>
          <select id="sort-select" class="font-semibold text-gray-900 bg-transparent border-none outline-none cursor-pointer">
            <option value="relevantes">Mais relevantes</option>
            <option value="menor_preco">Menor preço</option>
            <option value="maior_preco">Maior preço</option>
          </select>
        </div>
        <div class="flex gap-2">
          <button id="btn-grid" class="p-1.5 rounded transition-colors text-indigo-600 bg-indigo-50"><svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M4 4h4v4H4zm6 0h4v4h-4zm6 0h4v4h-4zM4 10h4v4H4zm6 0h4v4h-4zm6 0h4v4h-4zM4 16h4v4H4zm6 0h4v4h-4zm6 0h4v4h-4z"/></svg></button>
          <button id="btn-list" class="p-1.5 rounded transition-colors text-gray-400 hover:text-gray-600 bg-transparent"><svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg></button>
        </div>
      </div>

      <div id="produtos-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"></div>
      <div id="loading-msg" class="text-center py-10 text-gray-500">Buscando produtos...</div>
    </section>
  </main>

  <footer class="bg-gray-900 border-t border-gray-800 py-12 text-xs text-gray-500 w-full mt-auto">
    <div class="max-w-6xl mx-auto px-6 text-center">
      Criado no Brasil por <a class="font-bold text-indigo-400" href="https://www.estudioneto.com.br/" target="_blank">Estúdio Neto</a>
    </div>
  </footer>

  <script>
    let todosOsProdutos = [];
    let categoriaFiltro = null;
    let modoVisualizacao = 'grid';

    const container = document.getElementById('produtos-container');
    const msg = document.getElementById('loading-msg');
    const total = document.getElementById('total-produtos');
    const listaCategorias = document.getElementById('lista-categorias');
    const sortSelect = document.getElementById('sort-select');

    document.getElementById('btn-grid').addEventListener('click', (e) => {
      modoVisualizacao = 'grid';
      e.currentTarget.className = "p-1.5 rounded transition-colors text-indigo-600 bg-indigo-50";
      document.getElementById('btn-list').className = "p-1.5 rounded transition-colors text-gray-400 hover:text-gray-600 bg-transparent";
      renderizarLoja();
    });

    document.getElementById('btn-list').addEventListener('click', (e) => {
      modoVisualizacao = 'list';
      e.currentTarget.className = "p-1.5 rounded transition-colors text-indigo-600 bg-indigo-50";
      document.getElementById('btn-grid').className = "p-1.5 rounded transition-colors text-gray-400 hover:text-gray-600 bg-transparent";
      renderizarLoja();
    });

    sortSelect.addEventListener('change', () => renderizarLoja());

    async function carregarDados() {
      try {
        const response = await fetch('produtos.json?v=' + Date.now());
        if (!response.ok) throw new Error("Erro");
        todosOsProdutos = await response.json();
        if (todosOsProdutos.length === 0) return msg.textContent = "Nenhum produto.";
        msg.style.display = 'none';
        extrairCategorias();
        renderizarLoja();
      } catch (err) { msg.textContent = "Erro ao carregar produtos."; }
    }

    function extrairCategorias() {
      const catCount = {};
      todosOsProdutos.forEach(p => { let c = p.categoria ? p.categoria.trim() : "Outros"; catCount[c] = (catCount[c] || 0) + 1; });
      let html = `<li><a href="#" onclick="filtrarCategoria(null, event)" class="hover:text-indigo-600 transition-colors ${!categoriaFiltro ? 'font-bold text-gray-900' : ''}">Todas as Categorias <span class="text-gray-400 text-xs ml-1">(${todosOsProdutos.length})</span></a></li>`;
      for (const [c, count] of Object.entries(catCount)) {
        html += `<li><a href="#" onclick="filtrarCategoria('${c}', event)" class="hover:text-indigo-600 transition-colors ${categoriaFiltro === c ? 'font-bold text-gray-900' : ''}">${c} <span class="text-gray-400 text-xs ml-1">(${count})</span></a></li>`;
      }
      listaCategorias.innerHTML = html;
    }

    window.filtrarCategoria = function(cat, e) {
      if(e) e.preventDefault();
      categoriaFiltro = cat;
      extrairCategorias();
      renderizarLoja();
    };

    function renderizarLoja() {
      let f = todosOsProdutos;
      if (categoriaFiltro) f = f.filter(p => (p.categoria ? p.categoria.trim() : "Outros") === categoriaFiltro);
      
      if (sortSelect.value === 'menor_preco') f.sort((a, b) => (parseFloat(a.preco||0) - parseFloat(b.preco||0)));
      else if (sortSelect.value === 'maior_preco') f.sort((a, b) => (parseFloat(b.preco||0) - parseFloat(a.preco||0)));
      else f.sort((a, b) => parseInt(a.id) - parseInt(b.id));

      total.textContent = `${f.length} resultados`;

      if (modoVisualizacao === 'grid') {
        container.className = "grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4";
        container.innerHTML = f.map(criarCartao).join('');
      } else {
        container.className = "flex flex-col gap-4 border-t border-gray-200 pt-4";
        container.innerHTML = f.map(criarCartao).join('');
      }
    }

    function criarCartao(prod) {
      let imgSrc = prod.imagem || '';
      if (imgSrc && !imgSrc.startsWith('http') && !imgSrc.startsWith('data:')) imgSrc = 'https://estudioneto.github.io/estudio-neto-mastering1/' + imgSrc;

      let seloHtml = '';
      if(prod.selo === 'mais_vendido') seloHtml = `<div class="absolute top-2 left-2 bg-orange-500 text-white text-[10px] font-bold px-2 py-1 rounded shadow-sm z-10">🔥 MAIS VENDIDO</div>`;
      else if(prod.selo === 'oferta') seloHtml = `<div class="absolute top-2 left-2 bg-red-600 text-white text-[10px] font-bold px-2 py-1 rounded shadow-sm z-10">⏳ OFERTA RELÂMPAGO</div>`;
      else if(prod.selo === 'bonus') seloHtml = `<div class="absolute top-2 left-2 bg-indigo-600 text-white text-[10px] font-bold px-2 py-1 rounded shadow-sm z-10">🎁 COM BÔNUS</div>`;
      else if(prod.selo === 'lancamento') seloHtml = `<div class="absolute top-2 left-2 bg-emerald-600 text-white text-[10px] font-bold px-2 py-1 rounded shadow-sm z-10">🚀 LANÇAMENTO</div>`;

      const precoAtual = parseFloat((prod.preco || "0").replace(',', '.'));
      const precoAntigo = parseFloat((prod.preco_antigo || "0").replace(',', '.'));
      const parcelas = parseInt(prod.parcelas) || 1;
      
      let htmlPreco = '';
      if (precoAtual > 0) {
        const partesPreco = precoAtual.toFixed(2).split('.');
        let htmlAntigo = '', htmlDesconto = '', htmlParcela = '';
        
        if (precoAntigo > precoAtual) {
          htmlAntigo = `<s class="text-[12px] text-gray-400 block mb-0.5">R$ ${precoAntigo.toFixed(2).replace('.', ',')}</s>`;
          htmlDesconto = `<span class="text-[13px] text-emerald-600 font-medium ml-2">${Math.round(((precoAntigo - precoAtual)/precoAntigo)*100)}% OFF</span>`;
        }
        if (parcelas > 1) {
          htmlParcela = `<div class="text-[13px] text-emerald-600 font-medium leading-tight mt-1">em ${parcelas}x R$ ${(precoAtual/parcelas).toFixed(2).replace('.',',')} sem juros</div>`;
        }
        
        htmlPreco = `
          ${htmlAntigo}
          <div class="flex items-center">
            <span class="text-[24px] text-gray-900 leading-none">R$ ${partesPreco[0]}<span class="text-[14px] align-top ml-0.5">${partesPreco[1]}</span></span>
            ${htmlDesconto}
          </div>
          ${htmlParcela}
          <div class="text-[12px] text-emerald-600 font-bold mt-1">Envio imediato ⚡</div>
        `;
      }

      if(modoVisualizacao === 'list') {
        return `
          <a href="produto.html?id=${prod.id}" class="bg-white rounded-lg border border-gray-200 overflow-hidden hover:shadow-md transition-shadow duration-200 flex flex-row relative group text-decoration-none h-[180px]">
            ${seloHtml}
            <div class="w-[180px] flex-shrink-0 border-r border-gray-100 flex items-center justify-center p-4 bg-white relative">
              <img src="${imgSrc}" class="max-w-full max-h-full object-contain mix-blend-multiply transition-transform duration-300 group-hover:scale-105">
            </div>
            <div class="p-6 flex flex-col flex-grow justify-center">
              ${prod.vendas ? `<span class="text-[11px] font-semibold text-gray-400 uppercase tracking-wider mb-1">${prod.vendas}</span>` : ''}
              <h3 class="text-[18px] font-normal text-gray-800 leading-snug mb-2 line-clamp-2">${prod.titulo}</h3>
              <div>${htmlPreco}</div>
            </div>
          </a>`;
      }

      return `
        <a href="produto.html?id=${prod.id}" class="bg-white rounded-lg border border-gray-200 overflow-hidden hover:shadow-md transition-shadow duration-200 flex flex-col relative group text-decoration-none">
          ${seloHtml}
          <div class="w-full aspect-square border-b border-gray-100 flex items-center justify-center p-4 relative bg-white">
            <img src="${imgSrc}" class="max-w-full max-h-full object-contain mix-blend-multiply transition-transform duration-300 group-hover:scale-105">
          </div>
          <div class="p-4 flex flex-col flex-grow">
            ${prod.vendas ? `<span class="text-[11px] font-semibold text-gray-400 uppercase tracking-wider mb-2">${prod.vendas}</span>` : ''}
            <h3 class="text-[14px] font-normal text-gray-700 leading-snug mb-3 line-clamp-2">${prod.titulo}</h3>
            <div class="mt-auto">${htmlPreco}</div>
          </div>
        </a>`;
    }

    window.addEventListener('DOMContentLoaded', carregarDados);
  </script>
</body>
</html>
