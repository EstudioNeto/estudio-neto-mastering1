<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estúdio Neto Web Rádio | Ao Vivo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.4);
            --bg: #090d16;
            --card-bg: rgba(17, 24, 39, 0.75);
            --border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.15) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .back-link {
            position: absolute;
            top: 24px;
            left: 24px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.2s ease;
        }
        .back-link:hover {
            color: var(--text-main);
        }

        .player-container {
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border);
            border-radius: 32px;
            padding: 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .station-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 25px;
        }

        .station-name {
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .live-badge {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
            font-size: 0.7rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 100px;
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 1px;
        }

        .live-dot {
            width: 6px;
            height: 6px;
            background: #ef4444;
            border-radius: 50%;
            box-shadow: 0 0 8px #ef4444;
            animation: blink 1.4s infinite;
        }

        @keyframes blink {
            50% { opacity: 0.3; }
        }

        .artwork-wrapper {
            position: relative;
            width: 200px;
            height: 200px;
            border-radius: 24px;
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.05), 0 20px 30px -10px rgba(0,0,0,0.5);
        }

        .studio-logo {
            font-size: 3rem;
            margin-bottom: 8px;
            filter: drop-shadow(0 0 12px var(--primary-glow));
        }

        .visualizer {
            display: flex;
            align-items: flex-end;
            gap: 4px;
            height: 25px;
        }

        .bar {
            width: 4px;
            height: 6px;
            background: var(--primary);
            border-radius: 4px;
            transition: height 0.2s ease;
        }

        .playing .bar {
            animation: bounce 1s infinite alternate ease-in-out;
        }

        .playing .bar:nth-child(1) { animation-delay: 0.1s; }
        .playing .bar:nth-child(2) { animation-delay: 0.4s; }
        .playing .bar:nth-child(3) { animation-delay: 0.2s; }
        .playing .bar:nth-child(4) { animation-delay: 0.6s; }
        .playing .bar:nth-child(5) { animation-delay: 0.3s; }

        @keyframes bounce {
            0% { height: 4px; }
            100% { height: 26px; }
        }

        .track-details {
            text-align: center;
            width: 100%;
            margin-bottom: 20px;
        }

        .genre-tag {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--primary);
            background: rgba(99, 102, 241, 0.1);
            padding: 2px 10px;
            border-radius: 6px;
            display: inline-block;
            margin-bottom: 8px;
        }

        .track-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 4px;
            word-break: break-word;
        }

        .track-artist {
            font-size: 0.85rem;
            color: var(--text-muted);
            word-break: break-word;
        }

        /* Alerta de Erro Visual */
        .error-box {
            display: none;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.75rem;
            width: 100%;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .player-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 100%;
            margin-bottom: 25px;
        }

        .control-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .control-btn:hover {
            color: var(--text-main);
            transform: scale(1.1);
        }

        .btn-play {
            width: 65px;
            height: 65px;
            background: var(--primary);
            border-radius: 50%;
            color: #ffffff;
            box-shadow: 0 0 25px var(--primary-glow);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-play:hover {
            transform: scale(1.06);
            color: #ffffff;
            box-shadow: 0 0 35px var(--primary-glow);
        }

        .volume-box {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 80%;
        }

        .volume-box svg {
            fill: var(--text-muted);
            width: 18px;
            height: 18px;
        }

        input[type="range"] {
            flex: 1;
            height: 5px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 5px;
            appearance: none;
            -webkit-appearance: none;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: var(--text-main);
            border-radius: 50%;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
        Estúdio Neto Principal
    </a>

    <main class="player-container">
        <div class="station-header">
            <span class="station-name">Estúdio Neto</span>
            <div class="live-badge">
                <span class="live-dot"></span> NO AR
            </div>
        </div>

        <div class="artwork-wrapper">
            <div class="studio-logo">🎛️</div>
            <div class="visualizer" id="visualizer">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>
        </div>

        <div class="track-details">
            <span class="genre-tag" id="track-category">Rádio</span>
            <div class="track-title" id="track-title">Carregando...</div>
            <div class="track-artist" id="track-artist">Aguarde</div>
        </div>

        <!-- Caixa de Erro Informativa -->
        <div class="error-box" id="error-box"></div>

        <div class="player-controls">
            <button class="control-btn" id="prev-btn" title="Anterior">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
            </button>

            <button class="control-btn btn-play" id="play-btn" title="Reproduzir">
                <svg id="play-icon" width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            </button>

            <button class="control-btn" id="next-btn" title="Próxima">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
            </button>
        </div>

        <div class="volume-box">
            <svg viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5z"/></svg>
            <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.8">
            <svg viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
        </div>
    </main>

    <audio id="audio-player" preload="metadata"></audio>

    <script>
        // ====================================================================
        // IMPORTANTE: COLOQUE AQUI OS NOMES EXATOS DOS SEUS ARQUIVOS NO GITHUB
        // Verifique se a sua pasta no repositório se chama "audio" ou "musicas"
        // ====================================================================
        const playlist = [
            {
                title: "Música 1 (Exemplo)",
                artist: "Estúdio Neto",
                category: "Autoral",
                src: "./audio/musica1.mp3" // Se a sua pasta se chama "musicas", mude para "./musicas/musica1.mp3"
            },
            {
                title: "Música 2 (Exemplo)",
                artist: "Música Clássica",
                category: "Domínio Público",
                src: "./audio/musica2.mp3"
            }
        ];

        let currentIndex = 0;
        let isPlaying = false;

        const audio = document.getElementById("audio-player");
        const playBtn = document.getElementById("play-btn");
        const playIcon = document.getElementById("play-icon");
        const nextBtn = document.getElementById("next-btn");
        const prevBtn = document.getElementById("prev-btn");
        const titleEl = document.getElementById("track-title");
        const artistEl = document.getElementById("track-artist");
        const categoryEl = document.getElementById("track-category");
        const visualizer = document.getElementById("visualizer");
        const volumeSlider = document.getElementById("volume-slider");
        const errorBox = document.getElementById("error-box");

        const playSVG = '<polygon points="5 3 19 12 5 21 5 3"/>';
        const pauseSVG = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';

        function loadTrack(index) {
            errorBox.style.display = "none";
            const track = playlist[index];
            audio.src = track.src;
            audio.load();
            titleEl.textContent = track.title;
            artistEl.textContent = track.artist;
            categoryEl.textContent = track.category;
        }

        // DETECTOR DE ERRO: Mostra na tela se o arquivo não existe no GitHub
        audio.addEventListener("error", function() {
            const track = playlist[currentIndex];
            errorBox.style.display = "block";
            errorBox.innerHTML = `⚠️ <b>Arquivo não encontrado (Erro 404):</b><br>O navegador procurou por:<br><code>${track.src}</code><br><br>Verifique se o nome do arquivo ou da pasta no repositório está escrito idêntico.`;
            visualizer.classList.remove("playing");
            playIcon.innerHTML = playSVG;
            isPlaying = false;
        });

        function play() {
            audio.play().then(() => {
                isPlaying = true;
                playIcon.innerHTML = pauseSVG;
                visualizer.classList.add("playing");
                errorBox.style.display = "none";
            }).catch(err => {
                console.warn("Autoplay impedido ou arquivo com erro:", err);
            });
        }

        function pause() {
            audio.pause();
            isPlaying = false;
            playIcon.innerHTML = playSVG;
            visualizer.classList.remove("playing");
        }

        function togglePlay() {
            isPlaying ? pause() : play();
        }

        function nextTrack() {
            currentIndex = (currentIndex + 1) % playlist.length;
            loadTrack(currentIndex);
            if (isPlaying) play();
        }

        function prevTrack() {
            currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
            loadTrack(currentIndex);
            if (isPlaying) play();
        }

        playBtn.addEventListener("click", togglePlay);
        nextBtn.addEventListener("click", nextTrack);
        prevBtn.addEventListener("click", prevTrack);

        audio.addEventListener("ended", () => {
            nextTrack();
            play();
        });

        volumeSlider.addEventListener("input", (e) => {
            audio.volume = e.target.value;
        });

        // Inicia carregando a primeira música da lista
        loadTrack(currentIndex);
    </script>
</body>
</html>
